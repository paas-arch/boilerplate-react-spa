openapi: '3.0.3'
info:
  title: Service API
  version: '1.0.0'

tags:
  - name: notes
    description: Заметки — пример ресурса; замени на свой

paths:
  /api/v1/notes.get:
    get:
      operationId: notesGet
      summary: Последние заметки, новые первыми.
      tags: [notes]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesResponse'
        500:
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSendError'

  /api/v1/notes.create:
    post:
      operationId: notesCreatePost
      summary: Добавить заметку.
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        400:
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSendError'
        500:
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSendError'

components:
  schemas:
    JSendError:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
          description: Текст для человека, по-русски.

    NotesResponse:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'

    Note:
      type: object
      required: [id, text, createdAt]
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        createdAt:
          type: string
          format: date-time

    NoteCreateRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: От 1 до 500 знаков.
