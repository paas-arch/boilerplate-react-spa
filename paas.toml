# Настройки веб-приложения для панели paas. Панель читает этот файл при каждой раскатке версии:
# что здесь написано, то и работает на сервере. Правка — обычный коммит в main.
# Сборка проверяет файл: с ошибкой в нём версия не соберётся, причина будет в логе сборки.

# Имя сервиса. Обязано совпадать с именем репозитория: панель подставила его при создании.
name = "react-web"
description = "Веб-приложение на React"

# Веб-процесс: отдаёт страницы и пересылает /api в бэкенд проекта.
[service]
# Сколько копий держать запущенными, от 1 до 10. Две копии переживают перезапуск одной без простоя.
replicas = 1
# Сколько памяти и процессора выдать каждой копии: small, medium или large.
size = "small"

# Переменные сервера, который отдаёт страницы. В код страниц они не попадают:
# страницы собираются заранее, и всё, что нужно браузеру, задаётся при сборке.
# Со значением — обычная переменная, с пустой строкой — секрет, его значение вводят в панели.
# Адрес бэкенда (BACKEND_URL) задаёт панель, объявлять его здесь нельзя.
[env_vars]
