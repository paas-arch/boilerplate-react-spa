name: ci

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile

      # Типы клиента API лежат в git: если схема бэкенда изменилась без них, код расходится с контрактом.
      - name: Свежесть типов API
        run: |
          yarn api:generate
          [ -z "$(git status --porcelain -- src/shared/api/generated)" ] || { echo "типы API устарели: yarn api:generate, результат закоммитить"; exit 1; }

      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
      - run: yarn build
