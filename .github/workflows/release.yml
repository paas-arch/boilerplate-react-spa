# Не меняй этот файл: по образу, который он собирает, панель показывает версии и выкатывает приложение.
name: release

on:
  push:
    branches: ['main']
    paths-ignore: ['**.md']

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        shell: bash
        run: |
          set -euo pipefail
          # Адрес образа — из имени репозитория: GHCR принимает только строчные буквы. По пути /web панель узнаёт веб-приложение.
          image="ghcr.io/${GITHUB_REPOSITORY,,}/web"
          # Номер сборки растёт на единицу с каждым запуском: в панели версия видна как #<номер>.
          tag="main-${GITHUB_RUN_NUMBER}-$(git rev-parse --short=7 HEAD)"
          docker buildx build --platform linux/amd64,linux/arm64 --target web --push -t "$image:$tag" .
          echo "Собрана версия: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
